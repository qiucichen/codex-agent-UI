<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>消防业务对话 Agent</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h3>会话状态</h3>
      <div id="stateBox">初始化中...</div>
      <hr />
      <p>前端仅提供对话与交互UI，流程由 Python 引擎控制。</p>
      <hr />
      <h3>支持业务查询</h3>
      <p>
        - 用户名称： admin<br />
        - 查询单位的火警数量<br />
        - 查询单位的平面图<br />
        - 查询单位未闭环隐患数量<br />
        - 查询单位消防设备在线率<br />
      </p>
    </aside>

    <main class="chat-panel">
      <h1>🚒 消防业务对话 Agent（图文/登录/单位选择都在助手回复内）</h1>
      <div id="messages" class="messages"></div>

      <div class="composer">
        <input id="question" placeholder="请输入问题，例如：查询单位的火警数量" />
        <button id="sendBtn">发送</button>
      </div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
